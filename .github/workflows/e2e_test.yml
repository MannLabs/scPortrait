name: Perform e2e Tests

on:
  push:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-py3.13-uv-${{ hashFiles('pyproject.toml', 'requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-py3.13-uv-
            ${{ runner.os }}-uv-

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-python-3.11-uv-${{ hashFiles('pyproject.toml', 'requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-uv-

      - name: Install package
        run: |
          pip install uv
          uv pip install --system ".[tests]"

      - name: Test with pytest
        run: |
          pytest tests/e2e_tests --disable-warnings
