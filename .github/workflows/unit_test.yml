name: Perform Unit Test

on:
  push:
    branches: [main]
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-py3.13-uv-${{ hashFiles('pyproject.toml', 'requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-py3.13-uv-
            ${{ runner.os }}-uv-

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-py3.13-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-py3.13-pre-commit-
            ${{ runner.os }}-pre-commit-

      - name: Install package
        run: |
          pip install uv
          uv pip install --system ".[tests, dev]"

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

      - name: Test with pytest
        run: |
          pytest tests/unit_tests --disable-warnings
